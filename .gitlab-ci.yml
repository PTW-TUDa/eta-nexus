stages:
  - setup
  - check
  - test
  - deploy

workflow:
  rules:
    # Don't create a merge request pipeline for the default branch
    - if:  $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == $CI_DEFAULT_BRANCH
      when: never
    # Instead, create a branch pipeline for development
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Create merge request pipeline for other branches
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Create a pipeline for tags
    - if: $CI_COMMIT_TAG

.on_version_tag_rule:
  rules:
    # Deploy if a version tag was created
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # Poetry settings
  POETRY_VERSION: 2.4.1
  REGISTRY_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/poetry${POETRY_VERSION}

default:
  tags:
    - python
    - docker
  interruptible: true
  image: ${REGISTRY_IMAGE}:py3.11
  before_script:
    - python --version
    - rm -rf dist doc eta_nexus.egg-info build
    - rm -rf docs/_build docs/_stubs
    - ls -la
    # Install development dependencies
    - poetry sync

  # Cache gets invalidated when poetry.lock changes
  cache:
    key:
      files:
        - poetry.lock
      prefix: "global-deps"
    paths:
      - ${POETRY_CACHE_DIR}
      - ${PIP_CACHE_DIR}
    policy: pull


# Job to update pip cache
update-cache:
  stage: setup
  script: echo Updating cache
  cache:
    policy: pull-push
  artifacts:
    paths:
      - pyproject.toml
      - poetry.lock
  dependencies: []

ruff:
  stage: check
  before_script: []  # Skip poetry sync
  script:
    - ruff --version
    - ruff check
    - ruff format --check

codespell:
  stage: check
  before_script: []  # Skip poetry sync
  script:
    - codespell --version
    - codespell

mypy:
  stage: check
  script:
    - mypy --version
    - mypy --config-file pyproject.toml

poetry:
  stage: check
  before_script: []  # Skip poetry sync
  script:
    - poetry --version
    - poetry check

secret_detection:
  stage: check
  before_script: []

linkcheck-docs:
  stage: check
  script:
    - rm -rf docs/_build docs/_stubs
    - cd docs
    - python -m sphinx -b linkcheck . _build/linkcheck
  retry:
    max: 2
    when: script_failure


# Base test job.
#
# Runs the project's test suite using pytest. Tests are executed in parallel
# using pytest-xdist:
#   - `-n logical` starts one worker per logical CPU.
#   - `--dist loadscope` keeps tests from the same module together, reducing
#     fixture setup overhead.
#
# Failed jobs are retried once to mitigate occasional flaky failures.
.test:
  stage: test
  script:
    - pytest -n logical --dist loadscope -o log_cli=0 --disable-warnings --record-mode=none
  retry:
    max: 1
    when: script_failure

# Coverage-enabled test template.
#
# Extends the base test job by collecting test coverage and publishing both
# JUnit and Cobertura reports. These reports are consumed by GitLab to
# display test results and coverage information in merge requests.
.coverage:
  extends: .test
  coverage: '/TOTAL.*\s+(\d+%)$/'
  script:
    - pytest -n logical --dist loadscope -o log_cli=0 --cov --junitxml=./junit.xml --cov-report term --cov-report xml:coverage.xml --disable-warnings --record-mode=none
  artifacts:
    paths:
      - junit.xml
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Dependency update test template.
#
# Verifies that the project still works with the newest compatible dependency
# versions.
#
# The current lockfile is backed up, `poetry update` is executed, and the new
# lockfile is compared to the original. Tests are only executed when at least
# one dependency has changed, avoiding unnecessary CI runtime.
.test_updated_deps:
  extends: .test
  cache: []
  script:
    - cp poetry.lock poetry.lock.bak
    - poetry update
    - |
      if ! cmp -s poetry.lock poetry.lock.bak; then
        echo "Dependencies were updated! poetry.lock has changed."
        pytest -n logical --dist loadscope -o log_cli=0 --disable-warnings --record-mode=none
      else
        echo "No dependencies changed. Skipping tests."
      fi


# Primary test job for Python 3.11.
#
# This job additionally generates the project's coverage report and serves as
# the reference coverage shown by GitLab.
test3.11:
  extends: .coverage

# Re-runs the test suite against the latest compatible dependencies for
# Python 3.11.
test3.11_updated_deps:
  extends: .test_updated_deps
  image: ${REGISTRY_IMAGE}:py3.11
  needs:
    - test3.11

# Standard test run for Python 3.12.
test3.12:
  extends: .test
  image: ${REGISTRY_IMAGE}:py3.12

# Dependency compatibility test for Python 3.12.
test3.12_updated_deps:
  extends: .test_updated_deps
  image: ${REGISTRY_IMAGE}:py3.12
  needs:
    - test3.12

# Standard test run for Python 3.13.
test3.13:
  extends: .test
  image: ${REGISTRY_IMAGE}:py3.13

# Dependency compatibility test for Python 3.13.
test3.13_updated_deps:
  extends: .test_updated_deps
  image: ${REGISTRY_IMAGE}:py3.13
  needs:
    - test3.13

.deploy:
  stage: deploy
  rules:
    - !reference [.on_version_tag_rule, rules]


deploy-local:
  extends: .deploy
  before_script: [] # Skip poetry sync
  # Credentials for local repository
  variables:
    PASSWORD: '${CI_JOB_TOKEN}'
    USERNAME: 'gitlab-ci-token'
  script:
    - rm -rf dist build
    - poetry config repositories.eta-fabrik $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi
    - poetry publish --build --username $USERNAME --password $PASSWORD --repository eta-fabrik

# build the sources
deploy-pypi:
  extends: .deploy
  before_script: [] # Skip poetry sync
  # Credentials for pypi repository
  variables:
    PASSWORD: '${PYPI_UPLOAD_TOKEN}'
    USERNAME: '__token__'
  needs:
    - deploy-local
  script:
    - rm -rf dist
    - poetry publish --build --username $USERNAME --password $PASSWORD
  artifacts:
    name: "eta_nexus-build-$CI_COMMIT_REF_NAME-$CI_JOB_STATUS"
    paths:
      - dist/
      - eta_nexus.egg-info/

build-docker-images:
  stage: setup
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]  # allow shell

  variables:
    PYTHON_VERSIONS: "3.11 3.12 3.13"
    DOCKERFILE_PATH: ".gitlab/docker/Dockerfile"
    CONTEXT: "$CI_PROJECT_DIR"

  rules:
    # Only run on development branch when poetry.lock or dockerfile changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - poetry.lock
        - .gitlab/docker/Dockerfile
    # Or run manually from GitLab UI
    - when: manual
      allow_failure: true
  before_script:
    # Configure Kaniko / Docker auth for GitLab registry
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${CI_REGISTRY}": {
            "username": "${CI_REGISTRY_USER}",
            "password": "${CI_REGISTRY_PASSWORD}"
          }
        }
      }
      EOF

  script:
    - |
      for PYTHON_VERSION in $PYTHON_VERSIONS; do
        IMAGE_NAME="${REGISTRY_IMAGE}:py${PYTHON_VERSION}"
        echo "Building and pushing ${IMAGE_NAME} with Kaniko..."

        /kaniko/executor \
          --context "${CONTEXT}" \
          --dockerfile "${CONTEXT}/${DOCKERFILE_PATH}" \
          --destination "${IMAGE_NAME}" \
          --build-arg "PYTHON_VERSION=${PYTHON_VERSION}" \
          --build-arg "POETRY_VERSION=${POETRY_VERSION}" \
          --cache=true \
          --cache-repo "${REGISTRY_IMAGE}/cache" \
          --cleanup

        echo "Pushed ${IMAGE_NAME}"
      done
